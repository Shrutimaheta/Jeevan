# FREE fictional-data preview. See deploy/RENDER.md before applying.
# This database expires after 30 days; uploads are ephemeral.
services:
  - type: web
    name: jeevan-preview
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash deploy/render-build.sh
    startCommand: bash deploy/render-start.sh
    healthCheckPath: /health/ready/
    autoDeployTrigger: 'off'
    envVars:
      - key: JEEVAN_ENV
        value: production
      - key: JEEVAN_RENDER_PROFILE
        value: preview
      - key: JEEVAN_DEMO_MODE
        value: 'true'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PREVIEW_ACCESS_TOKEN
        generateValue: true
      - key: PREVIEW_ACCOUNT_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jeevan-preview-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: '0'
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend
      - key: WEB_CONCURRENCY
        value: '1'
      - key: TELECONSULTATION_ENABLED
        value: 'false'
databases:
  - name: jeevan-preview-db
    plan: free
    region: singapore
    databaseName: jeevan_qa
    user: jeevan_preview
    postgresMajorVersion: '16'
    ipAllowList: []
