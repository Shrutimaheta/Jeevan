name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeevan

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jeevan
          POSTGRES_PASSWORD: jeevan
          POSTGRES_DB: jeevan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeevan"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://jeevan:jeevan@localhost:5432/jeevan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jeevan/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Tests (PostgreSQL)
        run: python manage.py test --noinput

      - name: Production settings check
        env:
          JEEVAN_ENV: production
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: example.onrender.com
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput > /dev/null
