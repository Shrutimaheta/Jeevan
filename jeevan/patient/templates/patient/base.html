{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jeevan Healthcare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/healthcare-theme.css' %}" rel="stylesheet">
    <style>
        /* Modern Header Styles */
        .modern-header {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .logo-container {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 24px;
            color: white;
        }
        
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            color: white;
        }
        
        .main-nav {
            gap: 2rem;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-2px);
        }
        
        .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .user-section {
            position: relative;
        }
        
        .notification-bell {
            position: relative;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .notification-bell:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        
        .notification-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #FF6B6B;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        .user-profile-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .user-profile-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            transform: translateY(-2px);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .user-avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
        
        .user-name {
            font-weight: 500;
            font-size: 14px;
        }
        
        .main-content {
            background: #F8FAFC;
            min-height: calc(100vh - 80px);
            padding: 2rem 0;
        }
        
        /* Enhanced card styling */
        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
            overflow: hidden;
        }
        
        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .card-header {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-light);
            padding: var(--space-6);
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
        }
        
        .card-body {
            padding: var(--space-6);
        }
        
        /* Enhanced stats cards */
        .stats-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }
        
        .stats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-blue), var(--secondary-teal));
        }
        
        .stats-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }
        
        .stats-card .stats-number {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--primary-blue);
            margin-bottom: var(--space-2);
        }
        
        .stats-card .stats-label {
            color: var(--text-muted);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Enhanced button styling */
        .btn {
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            padding: var(--space-3) var(--space-6);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }
        
        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .btn-primary {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
            color: var(--text-white);
        }
        
        .btn-primary:hover {
            background: var(--primary-blue-hover);
            border-color: var(--primary-blue-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary {
            background: var(--secondary-teal);
            border-color: var(--secondary-teal);
            color: var(--text-white);
        }
        
        .btn-secondary:hover {
            background: var(--secondary-teal-hover);
            border-color: var(--secondary-teal-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-success {
            background: var(--success-green);
            border-color: var(--success-green);
            color: var(--text-white);
        }
        
        .btn-success:hover {
            background: var(--success-green-hover);
            border-color: var(--success-green-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-info {
            background: var(--info-cyan);
            border-color: var(--info-cyan);
            color: var(--text-white);
        }
        
        .btn-info:hover {
            background: var(--info-cyan-hover);
            border-color: var(--info-cyan-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        /* Enhanced form styling */
        .form-group {
            margin-bottom: var(--space-6);
        }
        
        .form-label {
            font-weight: var(--font-weight-medium);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            display: block;
            font-size: var(--font-size-sm);
        }
        
        .form-control {
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            padding: var(--space-3) var(--space-4);
            font-size: var(--font-size-sm);
            transition: all var(--transition-fast);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            outline: none;
        }
        
        .form-control::placeholder {
            color: var(--text-muted);
        }
        
        /* Enhanced alert styling */
        .alert {
            border-radius: var(--radius-md);
            padding: var(--space-4) var(--space-6);
            margin-bottom: var(--space-4);
            border: 1px solid;
        }
        
        .alert-success {
            background: var(--success-green-light);
            border-color: var(--success-green);
            color: var(--success-green);
        }
        
        .alert-danger {
            background: var(--danger-red-light);
            border-color: var(--danger-red);
            color: var(--danger-red);
        }
        
        .alert-warning {
            background: var(--warning-amber-light);
            border-color: var(--warning-amber);
            color: var(--warning-amber);
        }
        
        .alert-info {
            background: var(--info-cyan-light);
            border-color: var(--info-cyan);
            color: var(--info-cyan);
        }
        
        /* Enhanced table styling */
        .table {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .table th {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-light);
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            padding: var(--space-4) var(--space-6);
        }
        
        .table td {
            padding: var(--space-4) var(--space-6);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        
        .table tbody tr:hover {
            background: var(--bg-tertiary);
        }
        
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        
        /* Text colors */
        .text-primary {
            color: var(--primary-blue) !important;
        }
        
        .text-muted {
            color: var(--text-muted) !important;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .main-nav {
                display: none !important;
            }
            
            .logo-text {
                font-size: 20px;
            }
            
            .logo-container {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .user-name {
                display: none;
            }
            
            .user-profile-btn {
                padding: 0.5rem;
            }
            
            .main-content {
                padding: 1rem 0;
            }
        }
        
        @media (max-width: 576px) {
            .modern-header .container-fluid {
                padding: 0 1rem;
            }
            
            .logo-text {
                font-size: 18px;
            }
            
            .notification-bell {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Header with Integrated Navigation -->
    <header class="modern-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <div class="d-flex align-items-center">
                        <div class="logo-container">
                            <i class="fas fa-heartbeat"></i>
                        </div>
                        <h1 class="logo-text">JeevanCare</h1>
                    </div>
                </div>
                <div class="col-md-6">
                    <nav class="main-nav d-none d-md-flex justify-content-center">
                        <!-- Navigation menu items removed -->
                    </nav>
                </div>
                <div class="col-md-3">
                    <div class="user-section d-flex align-items-center justify-content-end gap-3">
                        <div class="notification-bell">
                            <i class="fas fa-bell"></i>
                            <span class="notification-badge">3</span>
                        </div>
                        <div class="dropdown">
                            <button class="user-profile-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                {% if patient.profile_photo %}
                                    <img src="{{ patient.profile_photo.url }}" alt="Profile" class="user-avatar">
                                {% else %}
                                    <div class="user-avatar-placeholder">
                                        <i class="fas fa-user"></i>
                                    </div>
                                {% endif %}
                                <span class="user-name">{{ patient.full_name|default:user.username }}</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="{% url 'patient:patient_profile' %}"><i class="fas fa-user me-2"></i>My Profile</a></li>
                                <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Settings</a></li>
                                <li><a class="dropdown-item" href="{% url 'patient:help_support' %}"><i class="fas fa-question-circle me-2"></i>Help & Support</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="{% url 'patient:patient_logout' %}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
