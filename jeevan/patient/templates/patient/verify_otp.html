{% extends 'patient/base.html' %}

{% block title %}Verify OTP - Jeevan Healthcare{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header text-center">
                    <h3 style="font-size: 28px;"><i class="fas fa-mobile-alt me-2"></i>Verify OTP</h3>
                    <p class="text-muted" style="font-size: 16px;">Enter the 6-digit OTP sent to {{ patient.contact_number }}</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="otp" class="form-label" style="font-size: 18px; font-weight: bold;">Enter OTP</label>
                            <input type="text" class="form-control text-center" id="otp" name="otp" 
                                   placeholder="000000" maxlength="6" style="font-size: 24px; letter-spacing: 0.5em;"
                                   pattern="[0-9]{6}" required>
                            <div class="form-text" style="font-size: 14px;">
                                <i class="fas fa-info-circle me-1"></i>
                                OTP is valid for 5 minutes
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" style="font-size: 16px;">
                                <i class="fas fa-check me-1"></i>Verify OTP
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted" style="font-size: 16px;">
                            Didn't receive OTP? 
                            <a href="{% url 'patient:forgot_password' %}" class="text-decoration-none">Try Again</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const otpInput = document.getElementById('otp');
    
    // Auto-focus on OTP input
    otpInput.focus();
    
    // Only allow numbers
    otpInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
    
    // Auto-submit when 6 digits are entered
    otpInput.addEventListener('input', function(e) {
        if (e.target.value.length === 6) {
            e.target.form.submit();
        }
    });
});
</script>
{% endblock %}
