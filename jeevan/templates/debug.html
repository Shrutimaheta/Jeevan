<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Debug Information</h1>
    
    <div class="debug-info">
        <h3>Static Files Test</h3>
        <p>CSS File: <a href="/static/assets/index-Ct1jLzce.css" target="_blank">Test CSS</a></p>
        <p>JS File: <a href="/static/assets/js/index-5O_Laqqa.js" target="_blank">Test JS</a></p>
    </div>
    
    <div class="debug-info">
        <h3>React App Test</h3>
        <div id="root">
            <p>If you see this text, React is not mounting properly.</p>
        </div>
    </div>
    
    <div class="debug-info">
        <h3>Console Errors</h3>
        <p>Open browser console (F12) to check for JavaScript errors.</p>
    </div>
    
    <script>
        console.log('Debug page loaded');
        console.log('Checking if React app loads...');
        
        // Test if the main JS file loads
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/static/assets/js/index-5O_Laqqa.js';
        script.onload = () => console.log('✅ Main JS file loaded successfully');
        script.onerror = () => console.log('❌ Failed to load main JS file');
        document.head.appendChild(script);
        
        // Test if CSS loads
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/static/assets/index-Ct1jLzce.css';
        link.onload = () => console.log('✅ CSS file loaded successfully');
        link.onerror = () => console.log('❌ Failed to load CSS file');
        document.head.appendChild(link);
    </script>
</body>
</html>
