{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Receptionist Dashboard - Jeevan Healthcare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/healthcare-theme.css' %}" rel="stylesheet">
    <style>
        /* Custom overrides for receptionist healthcare theme */
        .healthcare-header {
            background: linear-gradient(135deg, var(--secondary-teal) 0%, var(--primary-blue) 100%);
            color: var(--text-white);
            padding: 0 var(--space-6);
            border-bottom: none;
            box-shadow: var(--shadow-lg);
        }
        
        .healthcare-header h1 {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            margin: 0;
            display: flex;
            align-items: center;
        }
        
        .healthcare-sidebar {
            background: var(--bg-sidebar);
            box-shadow: var(--shadow-lg);
        }
        
        .healthcare-sidebar-header {
            padding: var(--space-6);
            border-bottom: 1px solid var(--border-medium);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .healthcare-sidebar-header h3 {
            margin: 0;
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-lg);
            color: var(--text-white);
        }
        
        .healthcare-sidebar-header p {
            margin: var(--space-2) 0 0 0;
            opacity: 0.8;
            font-size: var(--font-size-sm);
            color: var(--text-light);
        }
        
        .healthcare-main {
            background: var(--bg-secondary);
            min-height: 100vh;
        }
        
        /* Enhanced card styling for receptionist */
        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
            overflow: hidden;
        }
        
        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .card-header {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-light);
            padding: var(--space-6);
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
        }
        
        .card-body {
            padding: var(--space-6);
        }
        
        /* Enhanced button styling */
        .btn {
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            padding: var(--space-3) var(--space-6);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
        }
        
        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        
        .btn-primary {
            background: var(--secondary-teal);
            border-color: var(--secondary-teal);
            color: var(--text-white);
        }
        
        .btn-primary:hover {
            background: var(--secondary-teal-hover);
            border-color: var(--secondary-teal-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-secondary {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
            color: var(--text-white);
        }
        
        .btn-secondary:hover {
            background: var(--primary-blue-hover);
            border-color: var(--primary-blue-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-success {
            background: var(--success-green);
            border-color: var(--success-green);
            color: var(--text-white);
        }
        
        .btn-success:hover {
            background: var(--success-green-hover);
            border-color: var(--success-green-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-warning {
            background: var(--warning-amber);
            border-color: var(--warning-amber);
            color: var(--text-white);
        }
        
        .btn-warning:hover {
            background: var(--warning-amber-hover);
            border-color: var(--warning-amber-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-danger {
            background: var(--danger-red);
            border-color: var(--danger-red);
            color: var(--text-white);
        }
        
        .btn-danger:hover {
            background: var(--danger-red-hover);
            border-color: var(--danger-red-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-info {
            background: var(--info-cyan);
            border-color: var(--info-cyan);
            color: var(--text-white);
        }
        
        .btn-info:hover {
            background: var(--info-cyan-hover);
            border-color: var(--info-cyan-hover);
            color: var(--text-white);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        /* Enhanced table styling */
        .table {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .table th {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-light);
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            padding: var(--space-4) var(--space-6);
        }
        
        .table td {
            padding: var(--space-4) var(--space-6);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        
        .table tbody tr:hover {
            background: var(--bg-tertiary);
        }
        
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        
        /* Enhanced badge styling */
        .badge {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .badge.bg-success {
            background: var(--success-green-light) !important;
            color: var(--success-green) !important;
        }
        
        .badge.bg-warning {
            background: var(--warning-amber-light) !important;
            color: var(--warning-amber) !important;
        }
        
        .badge.bg-danger {
            background: var(--danger-red-light) !important;
            color: var(--danger-red) !important;
        }
        
        .badge.bg-info {
            background: var(--info-cyan-light) !important;
            color: var(--info-cyan) !important;
        }
        
        .badge.bg-primary {
            background: var(--primary-blue-light) !important;
            color: var(--primary-blue) !important;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .healthcare-sidebar {
                transform: translateX(-100%);
                transition: transform var(--transition-normal);
            }
            
            .healthcare-sidebar.show {
                transform: translateX(0);
            }
            
            .healthcare-main {
                margin-left: 0;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="healthcare-sidebar">
        <div class="healthcare-sidebar-header">
            <h3><i class="fas fa-user-nurse me-2"></i>Receptionist</h3>
            <p>Jinsy Rana</p>
        </div>
        <nav class="healthcare-nav">
            <div class="healthcare-nav-item">
                <a href="{% url 'receptionist:dashboard' %}" class="healthcare-nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt"></i>Dashboard
                </a>
            </div>
            <div class="healthcare-nav-item">
                <a href="{% url 'receptionist:profile' %}" class="healthcare-nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                    <i class="fas fa-user"></i>Profile
                </a>
            </div>
            <div class="healthcare-nav-item">
                <a href="{% url 'receptionist:appointments' %}" class="healthcare-nav-link {% if request.resolver_match.url_name == 'appointments' %}active{% endif %}">
                    <i class="fas fa-calendar-alt"></i>Appointments
                </a>
            </div>
            <div class="healthcare-nav-item">
                <a href="{% url 'receptionist:doctor_schedule' %}" class="healthcare-nav-link {% if request.resolver_match.url_name == 'doctor_schedule' %}active{% endif %}">
                    <i class="fas fa-calendar-check"></i>Doctor Schedule
                </a>
            </div>
        </nav>
    </div>

    <div class="healthcare-main">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
