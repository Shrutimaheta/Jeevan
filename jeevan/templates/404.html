<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Jeevan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c5aa0;
            --secondary-color: #1e3a8a;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .error-content {
            text-align: center;
        }
        
        .error-icon {
            font-size: 8rem;
            opacity: 0.8;
        }
        
        .btn-custom {
            background: white;
            color: var(--primary-color);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-custom:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="error-content">
                    <i class="fas fa-exclamation-triangle error-icon"></i>
                    <h1 class="display-4 fw-bold mb-4">Oops! Page Not Found</h1>
                    <p class="lead mb-4">{{ message|default:"The page you're looking for doesn't exist." }}</p>
                    <div class="d-flex flex-wrap justify-content-center gap-3">
                        <a href="/" class="btn btn-custom">
                            <i class="fas fa-home me-2"></i>Go Home
                        </a>
                        <a href="/#hospitals" class="btn btn-outline-light">
                            <i class="fas fa-hospital me-2"></i>Find Hospitals
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
